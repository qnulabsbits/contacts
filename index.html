<meta name="theme-color" content="#f5f5f7">

<title>QNu Labs | Contact Directory</title>

<style>
:root {
    --accent: #F06649;
    --background: #f5f5f7;
    --card: #ffffff;
    --text: #1d1d1f;
    --secondary: #6e6e73;
    --border: rgba(60,60,67,.14);
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: var(--background);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
}

a {
    text-decoration: none;
    color: inherit;
}

/* Header */

.topbar {
    width: 100%;
    padding: 20px;
    display: flex;
    justify-content: center;
    align-items: center;
    background: rgba(245,245,247,.85);
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    z-index: 10;
    backdrop-filter: blur(18px);
}

.logo {
    width: 150px;
    height: auto;
}

/* Main Container */

.container {
    width: min(100% - 32px, 560px);
    margin: auto;
    padding: 55px 0 45px;
}

/* Hero */

.hero {
    text-align: center;
    margin-bottom: 38px;
}

.eyebrow {
    color: var(--accent);
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-bottom: 14px;
}

h1 {
    font-family: 'DM Sans', sans-serif;
    font-size: clamp(30px, 7vw, 40px);
    font-weight: 700;
    letter-spacing: -1.5px;
    line-height: 1.15;
}

.description {
    color: var(--secondary);
    font-size: 15px;
    line-height: 1.6;
    margin-top: 13px;
}

/* Contact Cards */

.directory {
    display: grid;
    gap: 16px;
}

.contact-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 20px;
    display: flex;
    align-items: center;
    gap: 16px;
    box-shadow: 0 5px 18px rgba(0,0,0,.035);
    transition: transform .2s ease, box-shadow .2s ease;
}

.contact-card:hover {
    transform: translateY(-3px);
    box-shadow: 0 10px 26px rgba(0,0,0,.08);
}

.initials {
    width: 56px;
    height: 56px;
    flex-shrink: 0;
    border-radius: 50%;
    background: rgba(240,102,73,.12);
    color: var(--accent);
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: 'DM Sans', sans-serif;
    font-size: 17px;
    font-weight: 700;
}

.contact-info {
    flex: 1;
    min-width: 0;
}

.contact-name {
    font-family: 'DM Sans', sans-serif;
    font-size: 18px;
    font-weight: 700;
    line-height: 1.3;
}

.designation {
    color: var(--secondary);
    font-size: 13px;
    margin-top: 5px;
}

.view-profile {
    color: var(--accent);
    font-size: 13px;
    font-weight: 600;
    white-space: nowrap;
}

.arrow {
    font-size: 19px;
    margin-left: 3px;
}

/* Footer */

.footer {
    text-align: center;
    padding: 40px 10px 20px;
    color: var(--secondary);
    font-size: 12px;
    line-height: 1.8;
}

.footer a {
    color: var(--accent);
}

@media (max-width: 420px) {

    .contact-card {
        padding: 16px;
        gap: 12px;
    }

    .initials {
        width: 48px;
        height: 48px;
        font-size: 15px;
    }

    .contact-name {
        font-size: 15px;
    }

    .designation {
        font-size: 12px;
    }

    .view-profile {
        font-size: 11px;
    }
}
</style>
</head>
